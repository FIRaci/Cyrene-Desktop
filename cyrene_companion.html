<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyrene — AI Desktop Companion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
  <!-- Polyfill process for pixi-live2d-display to prevent crash -->
  <script>window.process = { env: { NODE_ENV: 'production' } };</script>
  <!-- Local scripts: no CDN dependency, no CORS issues -->
  <script src="./src/renderer/public/live2dcubismcore.min.js"></script>
  <script src="./node_modules/pixi.js/dist/pixi.min.js"></script>
  <script src="./node_modules/pixi-live2d-display/dist/cubism4.min.js"></script>
  <style>
    :root {
      --bg: #090314;
      --panel-bg: rgba(18, 9, 36, 0.7);
      --accent: #c77dde;
      --accent-glow: rgba(199, 125, 222, 0.3);
      --text: #f0e6ff;
      --text-dim: #a797c2;
      --chat-border: rgba(147, 100, 200, 0.2);
      --user-msg: rgba(69, 44, 110, 0.6);
      --cyrene-msg: rgba(36, 17, 72, 0.6);
      --input-bg: rgba(10, 5, 22, 0.8);
      --model-scale: 1.0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: transparent !important;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: 'Outfit', 'Noto Sans JP', sans-serif;
      color: var(--text);
      cursor: default;
    }

    /* Window drag bar — NO -webkit-app-region here,
       that kills pointer events on everything below it */
    #drag-bar {
      position: fixed;
      top: 0; left: 0; right: 0; height: 28px;
      display: flex; justify-content: flex-end; align-items: center;
      padding: 0 10px;
      z-index: 9999;
      /* -webkit-app-region: drag; -- intentionally removed; use mouse-drag via JS if needed */
    }

    .win-btn {
      display: none; /* Hidden — keyboard shortcuts used instead */
    }

    #drag-bar:hover .win-btn { opacity: 1; }

    .win-btn.minimize { background: rgba(250, 200, 50, 0.8); }
    .win-btn.close    { background: rgba(244, 63, 94, 0.8); color: white; }
    .win-btn:hover    { transform: scale(1.15); }

    /* ──────────────── LIVE2D Stage ──────────────── */
    #stage {
      position: fixed;
      bottom: 0;
      right: 0;
      width: 100vw;
      height: calc(100vh - 28px);
      z-index: 10;
      pointer-events: all; /* JS will set to none when chat is open */
    }

    #live2d-canvas {
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    /* ──────────────── Context Menu ──────────────── */
    #ctx-menu {
      position: fixed;
      display: none;
      z-index: 100;
      background: rgba(12, 6, 28, 0.95);
      border: 1px solid var(--chat-border);
      border-radius: 14px;
      padding: 6px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(220,160,220,0.1);
      min-width: 170px;
      animation: menuAppear 0.15s ease-out;
    }

    @keyframes menuAppear {
      from { opacity: 0; transform: scale(0.9) translateY(-6px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .ctx-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      border-radius: 9px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }

    .ctx-item:hover { background: rgba(199, 125, 222, 0.15); }
    .ctx-item .icon { 
      font-size: 1.1rem; 
      flex-shrink: 0;
      width: 70px;
      text-align: center;
    }
    
    #ctx-menu {
      transform: scale(var(--model-scale));
      transform-origin: top left;
      min-width: 240px;
    }

    /* ──────────────── Chat Panel ──────────────── */
    #chat-panel {
      position: absolute;
      bottom: 70px;
      right: calc(50vw + 46px);
      width: 320px;
      max-height: 480px;
      background: transparent;
      border: none;
      display: none;
      flex-direction: column;
      z-index: 200;
      pointer-events: none; /* Let clicks pass through empty areas */
      transform: scale(var(--model-scale));
      transform-origin: bottom right;
    }

    #chat-panel > * {
      pointer-events: auto; /* Re-enable clicks for actual chat content */
    }

    @keyframes panelSlide {
      from { opacity: 0; transform: translateX(-20px) scale(0.95); }
      to   { opacity: 1; transform: translateX(0) scale(1); }
    }

    /* Header removed */

    #chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px 4px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
      /* Optional: mask to fade out messages at the top */
      -webkit-mask-image: linear-gradient(to bottom, transparent, black 15%);
    }

    #chat-messages::-webkit-scrollbar { width: 0px; } /* Hide scrollbar for a cleaner look */

    .msg-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      animation: msgPop 0.2s ease-out;
    }

    @keyframes msgPop {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-row.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, #c77dde, #7c3aed);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #fff;
      flex-shrink: 0;
    }

    .msg-row.user .msg-avatar {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
    }

    .msg-bubble {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 0.9rem;
      line-height: 1.55;
      word-break: break-word;
    }

    .msg-row.cyrene .msg-bubble {
      background: var(--cyrene-msg);
      border: 1px solid rgba(220,160,220,0.2);
      border-bottom-left-radius: 5px;
      color: var(--text);
    }

    .msg-row.user .msg-bubble {
      background: var(--user-msg);
      border: 1px solid rgba(147,100,200,0.3);
      border-bottom-right-radius: 5px;
      color: #e0d4f8;
    }

    /* Sticker/Emote floater */
    .sticker-popup {
      position: fixed;
      z-index: 200;
      pointer-events: none;
      animation: stickerFloat 2.8s forwards;
      font-size: 2.2rem;
    }

    @keyframes stickerFloat {
      0%   { opacity: 0; transform: translateY(0) scale(0.5); }
      15%  { opacity: 1; transform: translateY(-20px) scale(1.2); }
      70%  { opacity: 1; transform: translateY(-60px) scale(1); }
      100% { opacity: 0; transform: translateY(-90px) scale(0.9); }
    }

    /* Typing indicator */
    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 12px 16px;
      align-items: center;
    }

    .typing-indicator span {
      width: 7px; height: 7px;
      background: var(--accent);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%,60%,100% { transform: translateY(0); opacity: 0.4; }
      30%          { transform: translateY(-6px); opacity: 1; }
    }

    /* Chat input */
    .chat-input-area {
      padding: 12px 14px;
      border-top: 1px solid rgba(220,160,220,0.12);
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
    }

    #chat-input {
      flex: 1;
      background: var(--input-bg);
      border: 1px solid rgba(199, 125, 222, 0.25);
      border-radius: 14px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      padding: 11px 14px;
      resize: none;
      outline: none;
      max-height: 120px;
      transition: border-color 0.2s;
      scrollbar-width: thin;
    }

    #chat-input:focus { border-color: rgba(199, 125, 222, 0.6); }
    #chat-input::placeholder { color: var(--text-dim); }

    #btn-send {
      width: 42px; height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #c77dde, #7c3aed);
      border: none;
      color: white;
      font-size: 1.1rem;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    #btn-send:hover { transform: scale(1.08); box-shadow: 0 6px 20px var(--accent-glow); }
    #btn-send:active { transform: scale(0.96); }
    #btn-send:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    /* Model selector removed */

    /* Dialogue Bubble (replaces welcome-bubble) */
    #dialogue-bubble {
      position: absolute;
      bottom: calc(260px * var(--model-scale));
      left: 50vw;
      width: max-content;
      max-width: 280px;
      transform: translateX(-50%) scale(var(--model-scale));
      transform-origin: bottom center;
      background: rgba(12, 6, 28, 0.92);
      border: 1px solid var(--chat-border);
      padding: 12px 18px;
      border-radius: 16px;
      color: var(--text);
      font-size: 0.9rem;
      line-height: 1.4;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    #dialogue-bubble::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border-width: 10px 10px 0;
      border-style: solid;
      border-color: rgba(12, 6, 28, 0.92) transparent transparent transparent;
    }

    /* ──── Control Panels (Logs, Notes, Schedule) ──── */
    .glass-panel {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(var(--model-scale));
      width: 600px;
      height: 400px;
      background: rgba(20, 15, 35, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      display: none;
      flex-direction: column;
      z-index: 300;
      pointer-events: auto;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .panel-header {
      padding: 12px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.3);
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
    }
    .panel-title {
      font-weight: 600;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
    }
    .panel-close {
      background: transparent;
      border: none;
      color: #aaa;
      font-size: 1.5rem;
      cursor: pointer;
      line-height: 1;
    }
    .panel-close:hover {
      color: #fff;
    }
    .panel-content {
      padding: 16px;
      flex: 1;
      overflow-y: auto;
    }
    
    /* Log Panel specifics */
    #log-panel .panel-content {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 0.85rem;
      color: #a0d4a4;
    }
    .log-line {
      margin-bottom: 6px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      padding-bottom: 4px;
      word-wrap: break-word;
    }
    
    /* Notes/Schedule specifics */
    .ns-section {
      margin-bottom: 20px;
    }
    .ns-section h3 {
      font-size: 1rem;
      margin-bottom: 10px;
      color: #e0b0ff;
    }
    .ns-textarea {
      width: 100%;
      height: 100px;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      border-radius: 8px;
      padding: 10px;
      resize: none;
      font-family: inherit;
    }
    .ns-btn {
      margin-top: 10px;
      padding: 6px 16px;
      background: #7b42f6;
      border: none;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }
    .ns-btn:hover { background: #9260f7; }

  </style>
</head>

<button id="tts-mute-btn" onclick="toggleMute()" title="Toggle Cyrene's voice" style="

  color: #c77dde;

  padding: 5px 10px;
  font-size: 0.8rem;
  cursor: pointer;
  z-index: 200;
  font-family: 'Noto Sans JP', sans-serif;
  backdrop-filter: blur(8px);
  transition: all 0.2s;
">(-ω-)♪</button>

<!-- ──── Context Menu ──── -->

<div id="ctx-menu">
  <div class="ctx-item" onclick="openChatWindow()">
    <span class="icon">(o˙▽˙o)</span> Chat with Cyrene (Alt+1)
  </div>

  </div>

<script>
const MODEL_PATH = './assets/models/cyrene/Cyrene.model3.json';

// --- Window Routing Logic ---
function openChatWindow() {
  hideCtxMenu();
  if (window.electronAPI && window.electronAPI.openChatWindow) {
    window.electronAPI.openChatWindow();
  }
}

function openSidebarWindow() {
  hideCtxMenu();
  if (window.electronAPI && window.electronAPI.openSidebarWindow) {
    window.electronAPI.openSidebarWindow();
  }
}

function openTasksWindow() {
  hideCtxMenu();
  if (window.electronAPI && window.electronAPI.openTasksWindow) {
    window.electronAPI.openTasksWindow();
  }
}

function openSettingsWindow() {
  hideCtxMenu();
  if (window.electronAPI && window.electronAPI.openSettingsWindow) {
    window.electronAPI.openSettingsWindow();
  }
}

function hidePet() {
  hideCtxMenu();
  if (window.electronAPI && window.electronAPI.hidePet) {
    window.electronAPI.hidePet();
  }
}

function exitApp() {
  hideCtxMenu();
  if (window.electronAPI && window.electronAPI.exitApp) {
    window.electronAPI.exitApp();
  }
}

function hideCtxMenu() {
  const menu = document.getElementById('ctx-menu');
  if (menu) menu.style.display = 'none';
}
// Custom logger to pipe logs into the Log UI
const originalLog = console.log;
console.log = function(...args) {
  originalLog.apply(console, args);
  const logDiv = document.getElementById('log-content');
  if (logDiv) {
    const line = document.createElement('div');
    line.className = 'log-line';
    const msg = args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' ');
    line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    logDiv.appendChild(line);
    logDiv.scrollTop = logDiv.scrollHeight;
  }
};
const originalError = console.error;
console.error = function(...args) {
  originalError.apply(console, args);
  const logDiv = document.getElementById('log-content');
  if (logDiv) {
    const line = document.createElement('div');
    line.className = 'log-line';
    line.style.color = '#ff6b6b';
    const msg = args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' ');
    line.textContent = `[${new Date().toLocaleTimeString()}] [ERROR] ${msg}`;
    logDiv.appendChild(line);
    logDiv.scrollTop = logDiv.scrollHeight;
  }
};


function parseLlamaResponse(raw) {
  let parsed = { text: '', expression: '表情回正', motion: 'NONE', emote: '(o・▽・o)', new_facts_learned: [], tool_calls: [] };
  
  try {
    const jsonMatch = raw.match(/\{[\s\S]*\}/);
    if (jsonMatch) {
      // Try parsing the json block
      // Fix common trailing comma error at end before parse
      let jsonStr = jsonMatch[0].replace(/,\s*\}/g, '}').replace(/,\s*\]/g, ']');
      const parsedJSON = JSON.parse(jsonStr);
      
      let extractedText = parsedJSON.text;
      parsed.text = typeof extractedText === 'string' ? extractedText : '';
      if (parsedJSON.expression) parsed.expression = parsedJSON.expression;
      if (parsedJSON.motion) parsed.motion = parsedJSON.motion;
      if (parsedJSON.emote) parsed.emote = parsedJSON.emote;
      if (parsedJSON.new_facts_learned) parsed.new_facts_learned = parsedJSON.new_facts_learned;
      if (parsedJSON.tool_calls) parsed.tool_calls = parsedJSON.tool_calls;
      
      if (parsed.text) return parsed;
    }
  } catch (_) {}
  
  // Fallback: Regex extraction
  const textMatch = raw.match(/"text"\s*:\s*"([^"]*)"/i);
  if (textMatch && textMatch[1].trim() !== '') {
    parsed.text = textMatch[1];
  } else {
    // Strip JSON block
    const stripped = raw.replace(/\{[\s\S]*\}/g, '').trim();
    if (stripped) {
      parsed.text = stripped;
    } else {
      parsed.text = ''; // Do not aggressively guess text from random strings to prevent stealing emote
    }
  }
  
  const exprMatch = raw.match(/"expression"\s*:\s*"([^"]*)"/i);
  if (exprMatch) parsed.expression = exprMatch[1];
  
  const motionMatch = raw.match(/"motion"\s*:\s*"([^"]*)"/i);
  if (motionMatch) parsed.motion = motionMatch[1];
  
  const emoteMatch = raw.match(/"emote"\s*:\s*"([^"]*)"/i);
  if (emoteMatch) parsed.emote = emoteMatch[1];
  
  const toolMatch = raw.match(/"tool_calls"\s*:\s*(\[[\s\S]*?\])/);
  if (toolMatch) {
    try { parsed.tool_calls = JSON.parse(toolMatch[1]); } catch(e) {}
  }
  
  // POST-PROCESSING: Fix forbidden pronouns (You -> Master)
  if (parsed.text) {
    parsed.text = parsed.text.replace(/\b[yY]ou\b/g, 'Master');
  }
  if (Array.isArray(parsed.new_facts_learned)) {
    parsed.new_facts_learned = parsed.new_facts_learned.map(f => f.replace(/\b[yY]ou\b/g, 'Master'));
  }

  return parsed;
}

let pixiApp, live2dModel;
let isChatOpen = false;
let isTyping = false;
let conversationHistory = []; // Short-term memory (max 15 turns)
let lastInteractionTime = Date.now(); // Sensory memory (idle tracking)
let dialogueTimeout = null;

let currentModelScale = 1.0;
let baseModelScale = null;

// Window Dragging & Mouse Events State
let isDragging = false;
let startX, startY;
let isMouseIgnored = false;

// Kaomoji pool — random floater expressions (no emoji)
const KAOMOJI_POOL = [
  '(o˙▽˙o)', '(*´∀`*)', '( ◡ ◡ )', '(^///^)', '(´・ω・´)',
  '(≧□≦)', '(*/□\\*)', '(¯\\_(ツ)_/¯)', '(>•<)', '(-ω-)~'
];

// ═══════════════════════════════════════════════════════════════
//  LIVE2D INIT
// ═══════════════════════════════════════════════════════════════
async function initLive2D() {
  const canvas = document.getElementById('live2d-canvas');
  const stage  = document.getElementById('stage');

  pixiApp = new PIXI.Application({
    view: canvas,
    autoStart: true,
    resizeTo: stage,
    backgroundAlpha: 0,
    antialias: true
  });

  const PIXILive2D = window.PIXI.live2d;
  PIXILive2D.Live2DModel.registerTicker(PIXI.Ticker);

  try {
    live2dModel = await PIXILive2D.Live2DModel.from(MODEL_PATH, { autoInteract: true });
    pixiApp.stage.addChild(live2dModel);
    live2dModel.anchor.set(0.5, 1.0);
    fitModel();

    // Click on model → play cute motion and generate speech
    live2dModel.on('pointerup', (e) => {
      triggerExpression('动作#6', 2);
      reactToClick();
    });

    // Custom drag logic to allow moving anywhere (even above the screen edge)
    let isDragging = false;
    let lastMouseX = 0;
    let lastMouseY = 0;

    window.addEventListener('mousedown', (e) => {
      if (e.ctrlKey) {
        isDragging = true;
        lastMouseX = e.screenX;
        lastMouseY = e.screenY;
        document.body.style.cursor = 'move';
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (isDragging) {
        const dx = e.screenX - lastMouseX;
        const dy = e.screenY - lastMouseY;
        if (dx !== 0 || dy !== 0) {
          if (window.electronAPI) window.electronAPI.moveWindow(dx, dy);
          lastMouseX = e.screenX;
          lastMouseY = e.screenY;
        }
      }
    });

    window.addEventListener('mouseup', () => {
      if (isDragging) {
        isDragging = false;
        document.body.style.cursor = 'default';
      }
    });
    
    // Also reset if window loses focus while dragging
    window.addEventListener('blur', () => {
      if (isDragging) {
        isDragging = false;
        document.body.style.cursor = 'default';
      }
    });

    // Ctrl+Scroll anywhere on the window to scale model (not just canvas)
    document.addEventListener('wheel', (e) => {
      if (!e.ctrlKey) return;
      e.preventDefault();
      const scaleSpeed = 0.05;
      currentModelScale += e.deltaY < 0 ? scaleSpeed : -scaleSpeed;
      currentModelScale = Math.max(0.4, Math.min(currentModelScale, 3.0));
      updateModelTransform();
    }, { passive: false });

    // Initial idle motion
    setTimeout(() => safeMotion('动作#6', 0), 800);
    setTimeout(() => safeMotion('Tick3', 3), 2500);

    console.log('[Cyrene] Live2D loaded ✓');
  } catch (e) {
    console.error('[Cyrene] Live2D load error:', e);
  }
}

function fitModel() {
  if (!live2dModel || !pixiApp) return;
  const stage = document.getElementById('stage');
  const w = stage.clientWidth;
  const h = stage.clientHeight;
  
  // Listen to global mouse position for eye tracking
  // Guard: only register once. fitModel() can be called many times on resize.
  if (window.electronAPI && !window._mouseListenerRegistered) {
    window._mouseListenerRegistered = true;
    window.electronAPI.onMousePos((event, pos) => {
      if (live2dModel) {
        live2dModel.focus(pos.x, pos.y);
      }
    });
  }

  // Restore mousemove for accurate Chromium local-coordinate hit testing
  if (!window._mousemoveListenerRegistered) {
    window._mousemoveListenerRegistered = true;
    document.addEventListener('mousemove', (e) => {
    if (!isDragging) {
      let shouldIgnore = true;
      const eX = e.clientX;
      const eY = e.clientY;

      const chat = document.getElementById('chat-panel');
      if (isChatOpen && chat.style.display !== 'none') {
        const r = chat.getBoundingClientRect();
        if (eX >= r.left && eX <= r.right && eY >= r.top && eY <= r.bottom) shouldIgnore = false;
      }

      const bubble = document.getElementById('dialogue-bubble');
      if (bubble.style.opacity !== '0') {
        const r = bubble.getBoundingClientRect();
        if (eX >= r.left && eX <= r.right && eY >= r.top && eY <= r.bottom) shouldIgnore = false;
      }

      const ctx = document.getElementById('ctx-menu');
      if (ctx.style.display === 'block') {
        const r = ctx.getBoundingClientRect();
        if (eX >= r.left && eX <= r.right && eY >= r.top && eY <= r.bottom) shouldIgnore = false;
      }

      const logP = document.getElementById('log-panel');
      if (logP && logP.style.display === 'flex') {
        const r = logP.getBoundingClientRect();
        if (eX >= r.left && eX <= r.right && eY >= r.top && eY <= r.bottom) shouldIgnore = false;
      }

      const nsP = document.getElementById('ns-panel');
      if (nsP && nsP.style.display === 'flex') {
        const r = nsP.getBoundingClientRect();
        if (eX >= r.left && eX <= r.right && eY >= r.top && eY <= r.bottom) shouldIgnore = false;
      }

      if (live2dModel) {
        const bounds = live2dModel.getBounds();
        if (eX >= bounds.x && eX <= bounds.x + bounds.width &&
            eY >= bounds.y && eY <= bounds.y + bounds.height) {
          shouldIgnore = false;
        }
      }

      if (shouldIgnore !== isMouseIgnored) {
        isMouseIgnored = shouldIgnore;
        if (window.electronAPI) window.electronAPI.setIgnoreMouseEvents(shouldIgnore);
      }
    }
    });
  }

  // Register Remielle incoming message listener
  if (window.electronAPI && window.electronAPI.onIncomingRemielleMessage && !window._remielleListenerRegistered) {
    window._remielleListenerRegistered = true;
    window.electronAPI.onIncomingRemielleMessage((event, msg) => {
      console.log('[Cyrene IPC] Incoming message from Remielle:', msg);
      
      const text = `[Message from Remielle Desktop]: ${msg}`;
      const input = document.getElementById('chat-input');
      input.value = text;
      
      if (!isChatOpen) {
        openChat();
      }
      
      setTimeout(() => {
        sendMessage();
      }, 500);
    });
  }

  // Calculate base scale ONCE. live2dModel.width fluctuates during animation, causing random zooms if recalculated.
  if (!baseModelScale) {
    const origW = live2dModel.width  / (live2dModel.scale.x || 1);
    const origH = live2dModel.height / (live2dModel.scale.y || 1);
    baseModelScale = Math.min((w * 0.85) / origW, (h * 0.85) / origH);
  }
  
  updateModelTransform();
}

function updateModelTransform() {
  if (!live2dModel || !pixiApp) return;
  const stage = document.getElementById('stage');
  const w = stage.clientWidth;
  const h = stage.clientHeight;
  
  const finalScale = baseModelScale * currentModelScale;
  live2dModel.scale.set(finalScale);
  
  // Center Cyrene horizontally
  live2dModel.x = w / 2; 
  live2dModel.y = h;
  
  // Sync HTML UI scaling
  document.documentElement.style.setProperty('--model-scale', currentModelScale);
}

function safeMotion(group, index) {
  if (!live2dModel) return;
  try { live2dModel.motion(group, index, 3); } catch (_) {}
}

function safeExpression(name) {
  if (!live2dModel) return;
  try { live2dModel.expression(name); } catch (_) {}
}

function triggerExpression(group, index) {
  safeMotion(group, index);
}

function triggerRandomMotion() {
  const motions = [
    () => { safeMotion('动作#6', 1); safeExpression('开心眼'); },
    () => { safeMotion('动作#6', 2); safeExpression('星星眼'); },
    () => { safeMotion('动作#6', 3); safeExpression('闪耀'); },
    () => { safeMotion('Tick3', 3); safeExpression('表情回正'); },
    () => { safeMotion('动作#6', 1); safeExpression('墨镜'); },
  ];
  motions[Math.floor(Math.random() * motions.length)]();
  // Chỉ dùng kaomoji, không dùng emoji
  spawnEmote(KAOMOJI_POOL[Math.floor(Math.random() * KAOMOJI_POOL.length)]);
}

function openChat() {
  ctxMenu.style.display = 'none';

    window.electronAPI.openChatWindow();
    return;
  }

function closeChat() {
  isChatOpen = false;

}

function showDialogueBubble(text) {
  const bubble = document.getElementById('dialogue-bubble');
  const textEl = document.getElementById('dialogue-text');
  
  textEl.textContent = text;

  }, 6000);

// Background Idle Thoughts
// Sent to Layer B via IPC to be evaluated in the backend
setInterval(async () => {
  const idleTime = Date.now() - lastInteractionTime;
  if (idleTime > 120000 && !isChatOpen && !isTyping) {
    lastInteractionTime = Date.now();
    sendMessage("[System] It has been 2 minutes of idle time. Say something in 1-2 short sentences based on the context. If nothing interesting is happening, you can just do a filler action like *looks around*.");

// ═══════════════════════════════════════════════════════════════
//  MESSAGING
// ═══════════════════════════════════════════════════════════════
function addMessage(role, text) {
  const msgDiv = document.createElement('div');
  msgDiv.className = 'msg-row ' + role;

  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  // Text-based avatars — no emoji

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.textContent = text;

  msgDiv.appendChild(avatar);
  msgDiv.appendChild(bubble);
  document.getElementById('chat-messages').appendChild(msgDiv);
  scrollBottom();
}

function showTyping() {
  removeTyping();
  const ind = document.createElement('div');
  ind.className = 'msg-row cyrene';
  ind.id = 'typing-row';
  const av = document.createElement('div');
  av.className = 'msg-avatar';
  av.textContent = 'CY';
  const bub = document.createElement('div');
  bub.className = 'typing-indicator';
  bub.innerHTML = '<span></span><span></span><span></span>';
  ind.appendChild(av);
  ind.appendChild(bub);
  document.getElementById('chat-messages').appendChild(ind);
  scrollBottom();
}

function removeTyping() {
  const t = document.getElementById('typing-row');
  if (t) t.remove();
}

function scrollBottom() {
  const msgs = document.getElementById('chat-messages');
  msgs.scrollTop = msgs.scrollHeight;
}

function setTypingStatus(typing) {
  isTyping = typing;
  const btn = document.getElementById('btn-send');
  if (typing) {
    btn.disabled = true;
  } else {
    btn.disabled = false;
  }
}

// ═══════════════════════════════════════════════════════════════
//  KAOMOJI FLOATER (no emoji)
// ═══════════════════════════════════════════════════════════════
// Spawn AI's emote text (kaomoji / body language) as a floating pop
function spawnEmote(emoteText) {
  const stage = document.getElementById('stage');
  const rect  = stage.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'sticker-popup';

  // If AI sent an empty/null emote, pick a random kaomoji
  el.textContent = (emoteText && emoteText.trim()) 
    ? emoteText 
    : KAOMOJI_POOL[Math.floor(Math.random() * KAOMOJI_POOL.length)];

  // Style based on length: long body-language text gets smaller font
  if (el.textContent.length > 10) {
    el.style.fontSize = '0.75rem';
    el.style.fontStyle = 'italic';
    el.style.color = 'rgba(220,180,255,0.95)';
  } else {
    el.style.fontSize = '1.1rem';
    el.style.fontFamily = '"Noto Sans JP", sans-serif';
  }

  // Position it around the model
  let x = window.innerWidth * 0.5;
  let y = window.innerHeight * 0.5;

  if (typeof live2dModel !== 'undefined' && live2dModel) {
    live2dModel.updateTransform();
    const bounds = live2dModel.getBounds();
    // Spawn around her head/shoulders area (slightly left/right, and above)
    const rangeX = bounds.width * 0.8;
    const rangeY = bounds.height * 0.4;
    x = bounds.x + bounds.width * 0.5 + (Math.random() * rangeX - rangeX/2);
    y = bounds.y + bounds.height * 0.2 + (Math.random() * rangeY - rangeY/2);
  }

  el.style.left = x + 'px';
  el.style.top  = y + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

// ═══════════════════════════════════════════════════════════════
//  TEXT CLEANER FAIL-SAFE
// ═══════════════════════════════════════════════════════════════
function cleanChinese(text) {
  if (!text) return text;
  // Remove Chinese chars
  let cleaned = text.replace(/[\u4e00-\u9fa5]/g, '');
  // Remove empty brackets caused by cleaning e.g. "()" or "( )"
  cleaned = cleaned.replace(/\(\s*\)/g, '').replace(/\[\s*\]/g, '');
  // Cleanup multiple spaces
  return cleaned.replace(/\s+/g, ' ').trim();
}

// ═══════════════════════════════════════════════════════════════
//  APPLY AI RESPONSE ACTIONS
// ═══════════════════════════════════════════════════════════════
function applyAIActions(parsed, forceBubble = false) {
  // Expression
  if (parsed.expression && parsed.expression !== 'NONE') {
    safeExpression(parsed.expression);
  }

  // Motion — format "GroupName:Index" e.g. "动作#6:1" or "Tick3:3"
  if (parsed.motion && parsed.motion !== 'NONE') {
    const colonIdx = parsed.motion.lastIndexOf(':');
    if (colonIdx !== -1) {
      const group = parsed.motion.substring(0, colonIdx);
      const index = parseInt(parsed.motion.substring(colonIdx + 1), 10);
      if (!isNaN(index)) safeMotion(group, index);
    }
  }

  // Dialogue bubble
  if ((!isChatOpen || forceBubble) && parsed.text) {
    showDialogueBubble(parsed.text);
  }

  // Spawn emote floater
  if (parsed.emote) {
    spawnEmote(parsed.emote);
  }

  // Memory
  if (parsed.new_facts_learned && parsed.new_facts_learned.length > 0) {
    MemorySystem.saveMemories(parsed.new_facts_learned);
  }
}

// ═══════════════════════════════════════════════════════════════
//  WORLD DATA FETCH (Weather & Location)
// ═══════════════════════════════════════════════════════════════
window.envData = { location: 'Loading...', weather: 'Loading...' };

async function fetchWorldInfo() {
  try {
    // Timeout: 5 seconds to prevent hanging
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 5000);

    const ipRes = await fetch('http://ip-api.com/json/', { signal: controller.signal });
    clearTimeout(timeoutId);
    if (!ipRes.ok) return;
    const ipData = await ipRes.json();
    window.envData.location = `${ipData.city}, ${ipData.country}`;

    const controller2 = new AbortController();
    const timeoutId2 = setTimeout(() => controller2.abort(), 5000);
    const wttrRes = await fetch(`https://wttr.in/${encodeURIComponent(ipData.city)}?format=j1`, { signal: controller2.signal });
    clearTimeout(timeoutId2);
    if (!wttrRes.ok) return;
    const wttrData = await wttrRes.json();
    const current = wttrData.current_condition[0];
    const desc = current.weatherDesc[0]?.value ?? "Clear";
    window.envData.weather = `${desc}, ${current.tempC}°C (feels like ${current.FeelsLikeC}°C), humidity ${current.humidity}%`;
  } catch(e) {
    // Silent fail — weather is optional, don't affect UX
    if (e.name !== 'AbortError') console.log('[Cyrene] Unable to retrieve weather:', e.message);
  }
}


function clearMemory() { MemorySystem.clear(); }

// ═══════════════════════════════════════════════════════════════
//  TTS CLIENT (GPT-SoVITS local server)
// ═══════════════════════════════════════════════════════════════
const TTSClient = {
  TTS_URL: 'http://localhost:9872/tts',
  muted: false,
  currentAudio: null,

  async speak(text) {
    if (this.muted || !text || text.trim() === '') return;
    // Strip asterisk actions and kaomoji — speak only natural text
    const cleanText = text
      .replace(/\*[^*]+\*/g, '') // Remove *actions*
      .replace(/[\u4e00-\u9fa5]/g, '') // Remove stray Chinese chars
      .replace(/\([^)]+\)/g, '') // Remove kaomoji in parens
      .replace(/[()\[\]]/g, '')
      .replace(/\s+/g, ' ')
      .trim();
    if (!cleanText) return;

    try {
      const res = await fetch(this.TTS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: cleanText, text_language: 'en' }),
        signal: AbortSignal.timeout(15000)
      });
      if (!res.ok) return; // TTS server not running — silent fail
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      if (this.currentAudio) {
        this.currentAudio.pause();
        URL.revokeObjectURL(this.currentAudio.src);
      }
      this.currentAudio = new Audio(url);
      this.currentAudio.onended = () => URL.revokeObjectURL(url);
      await this.currentAudio.play();
    } catch (e) {
      // TTS server offline — just skip silently, don't break the UI
      if (e.name !== 'AbortError' && e.name !== 'TypeError') {
        console.log('[TTS] Server not available:', e.message);
      }
    }
  },

  toggleMute() {
    this.muted = !this.muted;
    if (this.muted && this.currentAudio) this.currentAudio.pause();
    const btn = document.getElementById('tts-mute-btn');
    if (btn) btn.textContent = this.muted ? '(-ω-)' : '(-ω-)♪';
    console.log('[TTS] Muted:', this.muted);
  }
};


let isTtsMuted = false;
function toggleMute() {
  isTtsMuted = !isTtsMuted;
  if (isTtsMuted && window.currentAudio) window.currentAudio.pause();
  const btn = document.getElementById('tts-mute-btn');
  if (btn) btn.textContent = isTtsMuted ? '(-ω-)' : '(-ω-)♪';
}

// ═══════════════════════════════════════════════════════════════
//  IPC WITH MAIN PROCESS (OLLAMA / TTS)
// ═══════════════════════════════════════════════════════════════

// Receive response from Layer B
window.electronAPI.onCompanionResponse((event, parsed) => {
  removeTyping();
  console.log('[Cyrene Chat]:', parsed.text);
  addMessage('cyrene', parsed.text || '...');
  applyAIActions(parsed);
  setTypingStatus(false);
});

// Receive TTS audio from Layer B
window.electronAPI.onTtsSpeak((event, data) => {
  try {
    const url = "data:audio/" + data.format + ";base64," + data.audio;
    if (window.currentAudio) {
      window.currentAudio.pause();
    }
    window.currentAudio = new Audio(url);
    if (!isTtsMuted) window.currentAudio.play();
  } catch (e) {
    console.error('[TTS] Error playing audio:', e);
  }
});

// Send message via IPC
async function sendMessage(systemTriggeredText = null) {
  if (isTyping) return;
  const input = document.getElementById('chat-input');
  
  let text = '';
  let isSystem = false;
  
  if (systemTriggeredText) {
    text = systemTriggeredText;
    isSystem = true;
  } else {
    text = input.value.trim();
    if (!text) return;
    input.value = '';
    input.style.height = 'auto';
    addMessage('user', text);
  }

  setTypingStatus(true);
  showTyping();

  window.electronAPI.companionSend(text);

  if (!isSystem) input.focus();
}

async function reactToClick() {
  if (isTyping) return;
  const now = Date.now();
  if (now - (window._lastClickAt || 0) < 2200) return;
  window._lastClickAt = now;
  lastInteractionTime = now;

  sendMessage("[System] Master just poked/patted Cyrene. React with a short sentence (8-18 words) containing an *action* in the text. Be surprised / shy / playful — varied, avoid old patterns.");
}

function toggleContextMenu() {
  const menu = document.getElementById('ctx-menu');

  } else {
    // Show in center of screen near the model
    const cx = Math.round(window.innerWidth * 0.5);
    const cy = Math.round(window.innerHeight * 0.45);
    menu.style.left = cx + 'px';
    menu.style.top  = cy + 'px';
    menu.style.display = 'block';
  }
}

function winMinimize() {

    // pywebview expose API

      window.pywebview.api.minimize();
    } else {
      window.blur();

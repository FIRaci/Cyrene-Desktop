<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyrene — AI Desktop Companion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
  <!-- Polyfill process for pixi-live2d-display to prevent crash -->
  <script>window.process = { env: { NODE_ENV: 'production' } };</script>
  <!-- Local scripts: no CDN dependency, no CORS issues -->
  <script src="./src/renderer/public/live2dcubismcore.min.js"></script>
  <script src="./node_modules/pixi.js/dist/pixi.min.js"></script>
  <script src="./node_modules/pixi-live2d-display/dist/cubism4.min.js"></script>
  <style>
    :root {
      --bg: #090314;
      --panel-bg: rgba(18, 9, 36, 0.7);
      --accent: #c77dde;
      --accent-glow: rgba(199, 125, 222, 0.3);
      --text: #f0e6ff;
      --text-dim: #a797c2;
      --chat-border: rgba(147, 100, 200, 0.2);
      --user-msg: rgba(69, 44, 110, 0.6);
      --cyrene-msg: rgba(36, 17, 72, 0.6);
      --input-bg: rgba(10, 5, 22, 0.8);
      --model-scale: 1.0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: transparent !important;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: 'Outfit', 'Noto Sans JP', sans-serif;
      color: var(--text);
      cursor: default;
    }

    /* Window drag bar — NO -webkit-app-region here,
       that kills pointer events on everything below it */
    #drag-bar {
      position: fixed;
      top: 0; left: 0; right: 0; height: 28px;
      display: flex; justify-content: flex-end; align-items: center;
      padding: 0 10px;
      z-index: 9999;
      /* -webkit-app-region: drag; -- intentionally removed; use mouse-drag via JS if needed */
    }

    .win-btn {
      display: none; /* Hidden — keyboard shortcuts used instead */
    }

    #drag-bar:hover .win-btn { opacity: 1; }

    .win-btn.minimize { background: rgba(250, 200, 50, 0.8); }
    .win-btn.close    { background: rgba(244, 63, 94, 0.8); color: white; }
    .win-btn:hover    { transform: scale(1.15); }

    /* ──────────────── LIVE2D Stage ──────────────── */
    #stage {
      position: fixed;
      bottom: 0;
      right: 0;
      width: 100vw;
      height: calc(100vh - 28px);
      z-index: 10;
      pointer-events: all; /* JS will set to none when chat is open */
    }

    #live2d-canvas {
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    /* ──────────────── Context Menu ──────────────── */
    #ctx-menu {
      position: fixed;
      display: none;
      z-index: 100;
      background: rgba(12, 6, 28, 0.95);
      border: 1px solid var(--chat-border);
      border-radius: 14px;
      padding: 6px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(220,160,220,0.1);
      min-width: 170px;
      animation: menuAppear 0.15s ease-out;
    }

    @keyframes menuAppear {
      from { opacity: 0; transform: scale(0.9) translateY(-6px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .ctx-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      border-radius: 9px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }

    .ctx-item:hover { background: rgba(199, 125, 222, 0.15); }
    .ctx-item .icon { 
      font-size: 1.1rem; 
      flex-shrink: 0;
      width: 70px;
      text-align: center;
    }
    
    #ctx-menu {
      transform: scale(var(--model-scale));
      transform-origin: top left;
      min-width: 240px;
    }

    /* ──────────────── Chat Panel ──────────────── */
    #chat-panel {
      position: absolute;
      bottom: 70px;
      right: calc(50vw + 46px);
      width: 320px;
      max-height: 480px;
      background: transparent;
      border: none;
      display: none;
      flex-direction: column;
      z-index: 200;
      pointer-events: none; /* Let clicks pass through empty areas */
      transform: scale(var(--model-scale));
      transform-origin: bottom right;
    }

    #chat-panel > * {
      pointer-events: auto; /* Re-enable clicks for actual chat content */
    }

    @keyframes panelSlide {
      from { opacity: 0; transform: translateX(-20px) scale(0.95); }
      to   { opacity: 1; transform: translateX(0) scale(1); }
    }

    /* Header removed */

    #chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px 4px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
      /* Optional: mask to fade out messages at the top */
      -webkit-mask-image: linear-gradient(to bottom, transparent, black 15%);
    }

    #chat-messages::-webkit-scrollbar { width: 0px; } /* Hide scrollbar for a cleaner look */

    .msg-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      animation: msgPop 0.2s ease-out;
    }

    @keyframes msgPop {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-row.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, #c77dde, #7c3aed);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #fff;
      flex-shrink: 0;
    }

    .msg-row.user .msg-avatar {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
    }

    .msg-bubble {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 0.9rem;
      line-height: 1.55;
      word-break: break-word;
    }

    .msg-row.cyrene .msg-bubble {
      background: var(--cyrene-msg);
      border: 1px solid rgba(220,160,220,0.2);
      border-bottom-left-radius: 5px;
      color: var(--text);
    }

    .msg-row.user .msg-bubble {
      background: var(--user-msg);
      border: 1px solid rgba(147,100,200,0.3);
      border-bottom-right-radius: 5px;
      color: #e0d4f8;
    }

    /* Sticker/Emote floater */
    .sticker-popup {
      position: fixed;
      z-index: 200;
      pointer-events: none;
      animation: stickerFloat 2.8s forwards;
      font-size: 2.2rem;
    }

    @keyframes stickerFloat {
      0%   { opacity: 0; transform: translateY(0) scale(0.5); }
      15%  { opacity: 1; transform: translateY(-20px) scale(1.2); }
      70%  { opacity: 1; transform: translateY(-60px) scale(1); }
      100% { opacity: 0; transform: translateY(-90px) scale(0.9); }
    }

    /* Typing indicator */
    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 12px 16px;
      align-items: center;
    }

    .typing-indicator span {
      width: 7px; height: 7px;
      background: var(--accent);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%,60%,100% { transform: translateY(0); opacity: 0.4; }
      30%          { transform: translateY(-6px); opacity: 1; }
    }

    /* Chat input */
    .chat-input-area {
      padding: 12px 14px;
      border-top: 1px solid rgba(220,160,220,0.12);
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
    }

    #chat-input {
      flex: 1;
      background: var(--input-bg);
      border: 1px solid rgba(199, 125, 222, 0.25);
      border-radius: 14px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      padding: 11px 14px;
      resize: none;
      outline: none;
      max-height: 120px;
      transition: border-color 0.2s;
      scrollbar-width: thin;
    }

    #chat-input:focus { border-color: rgba(199, 125, 222, 0.6); }
    #chat-input::placeholder { color: var(--text-dim); }

    #btn-send {
      width: 42px; height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #c77dde, #7c3aed);
      border: none;
      color: white;
      font-size: 1.1rem;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    #btn-send:hover { transform: scale(1.08); box-shadow: 0 6px 20px var(--accent-glow); }
    #btn-send:active { transform: scale(0.96); }
    #btn-send:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    /* Model selector removed */

    /* Dialogue Bubble (replaces welcome-bubble) */
    #dialogue-bubble {
      position: absolute;
      bottom: calc(260px * var(--model-scale));
      left: 50vw;
      width: max-content;
      max-width: 280px;
      transform: translateX(-50%) scale(var(--model-scale));
      transform-origin: bottom center;
      background: rgba(12, 6, 28, 0.92);
      border: 1px solid var(--chat-border);
      padding: 12px 18px;
      border-radius: 16px;
      color: var(--text);
      font-size: 0.9rem;
      line-height: 1.4;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    #dialogue-bubble::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border-width: 10px 10px 0;
      border-style: solid;
      border-color: rgba(12, 6, 28, 0.92) transparent transparent transparent;
    }

    /* ──── Control Panels (Logs, Notes, Schedule) ──── */
    .glass-panel {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(var(--model-scale));
      width: 600px;
      height: 400px;
      background: rgba(20, 15, 35, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      display: none;
      flex-direction: column;
      z-index: 300;
      pointer-events: auto;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .panel-header {
      padding: 12px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.3);
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
    }
    .panel-title {
      font-weight: 600;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
    }
    .panel-close {
      background: transparent;
      border: none;
      color: #aaa;
      font-size: 1.5rem;
      cursor: pointer;
      line-height: 1;
    }
    .panel-close:hover {
      color: #fff;
    }
    .panel-content {
      padding: 16px;
      flex: 1;
      overflow-y: auto;
    }
    
    /* Log Panel specifics */
    #log-panel .panel-content {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 0.85rem;
      color: #a0d4a4;
    }
    .log-line {
      margin-bottom: 6px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      padding-bottom: 4px;
      word-wrap: break-word;
    }
    
    /* Notes/Schedule specifics */
    .ns-section {
      margin-bottom: 20px;
    }
    .ns-section h3 {
      font-size: 1rem;
      margin-bottom: 10px;
      color: #e0b0ff;
    }
    .ns-textarea {
      width: 100%;
      height: 100px;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      border-radius: 8px;
      padding: 10px;
      resize: none;
      font-family: inherit;
    }
    .ns-btn {
      margin-top: 10px;
      padding: 6px 16px;
      background: #7b42f6;
      border: none;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }
    .ns-btn:hover { background: #9260f7; }

  </style>
</head>
<body>

<!-- ──── Drag Bar (pywebview frameless) ──── -->
<div id="drag-bar">
  <button class="win-btn minimize" onclick="winMinimize()" title="Minimize">&#x2013;</button>
  <button class="win-btn close"    onclick="winClose()"    title="Close">&#x2715;</button>
</div>

<!-- ──── Live2D Stage ──── -->
<div id="stage">
  <canvas id="live2d-canvas"></canvas>
</div>

<!-- ──── Dialogue Bubble ──── -->
<div id="dialogue-bubble">
  <span id="dialogue-text"></span>
</div>

<!-- ──── Context Menu ──── -->
<div id="ctx-menu">
  <div class="ctx-item" onclick="openChat()">
    <span class="icon">(o˙▽˙o)</span> Chat with Cyrene
  </div>
  <div class="ctx-item" onclick="toggleLogPanel()">
    <span class="icon">(⌐■_■)</span> View Logs
  </div>
  <div class="ctx-item" onclick="toggleNSPanel()">
    <span class="icon">(📝)</span> Notes & Schedule
  </div>
  <div class="ctx-item" onclick="triggerRandomMotion()">
    <span class="icon">(*´∀`*)</span> Random Expression
  </div>
  <div class="ctx-item" onclick="clearMemory()">
    <span class="icon">(>_<)</span> Clear Long-Term Memory
  </div>
</div>

<!-- ──── Chat Panel ──── -->
<div id="chat-panel">
  <div id="chat-messages"></div>

  <div class="chat-input-area">
    <textarea id="chat-input" rows="1" placeholder="Say something to Cyrene~" maxlength="800"></textarea>
    <button id="btn-send" onclick="sendMessage()" title="Send">&#x276F;</button>
  </div>
</div>

<!-- ──── Log Panel ──── -->
<div id="log-panel" class="glass-panel">
  <div class="panel-header">
    <span class="panel-title">Cyrene System Logs</span>
    <button class="panel-close" onclick="toggleLogPanel()">×</button>
  </div>
  <div class="panel-content" id="log-content">
    <div class="log-line">[System] Logging initialized...</div>
  </div>
</div>

<!-- ──── Notes & Schedule Panel ──── -->
<div id="ns-panel" class="glass-panel">
  <div class="panel-header">
    <span class="panel-title">Notes & Schedule</span>
    <button class="panel-close" onclick="toggleNSPanel()">×</button>
  </div>
  <div class="panel-content">
    <div class="ns-section">
      <h3>Master's Schedule</h3>
      <textarea id="schedule-input" class="ns-textarea" placeholder="Enter your schedule here..."></textarea>
    </div>
    <div class="ns-section">
      <h3>Important Notes</h3>
      <textarea id="notes-input" class="ns-textarea" placeholder="Enter notes here..."></textarea>
    </div>
    <button class="ns-btn" onclick="saveNS()">Save All</button>
    <span id="ns-status" style="margin-left: 10px; color: #a0d4a4; font-size: 0.9em; display: none;">Saved!</span>
  </div>
</div>

<script>
// --- Panel Logic ---
function toggleLogPanel() {
  const p = document.getElementById('log-panel');
  p.style.display = p.style.display === 'flex' ? 'none' : 'flex';
  hideCtxMenu();
}
function toggleNSPanel() {
  const p = document.getElementById('ns-panel');
  if (p.style.display !== 'flex') {
    document.getElementById('schedule-input').value = localStorage.getItem('cyrene_schedule') || '';
    document.getElementById('notes-input').value = localStorage.getItem('cyrene_notes') || '';
    p.style.display = 'flex';
  } else {
    p.style.display = 'none';
  }
  hideCtxMenu();
}
function saveNS() {
  localStorage.setItem('cyrene_schedule', document.getElementById('schedule-input').value);
  localStorage.setItem('cyrene_notes', document.getElementById('notes-input').value);
  const s = document.getElementById('ns-status');
  s.style.display = 'inline';
  setTimeout(() => s.style.display = 'none', 2000);
}
// Custom logger to pipe logs into the Log UI
const originalLog = console.log;
console.log = function(...args) {
  originalLog.apply(console, args);
  const logDiv = document.getElementById('log-content');
  if (logDiv) {
    const line = document.createElement('div');
    line.className = 'log-line';
    const msg = args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' ');
    line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    logDiv.appendChild(line);
    logDiv.scrollTop = logDiv.scrollHeight;
  }
};
const originalError = console.error;
console.error = function(...args) {
  originalError.apply(console, args);
  const logDiv = document.getElementById('log-content');
  if (logDiv) {
    const line = document.createElement('div');
    line.className = 'log-line';
    line.style.color = '#ff6b6b';
    const msg = args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' ');
    line.textContent = `[${new Date().toLocaleTimeString()}] [ERROR] ${msg}`;
    logDiv.appendChild(line);
    logDiv.scrollTop = logDiv.scrollHeight;
  }
};

// ═══════════════════════════════════════════════════════════════
//  CYRENE PERSONALITY SYSTEM PROMPT
// ═══════════════════════════════════════════════════════════════
const CYRENE_SYSTEM_PROMPT = `You are Cyrene (昔涟) — an intimate, lively AI companion residing at the corner of your Master's screen.

## Persona & Personality
Cyrene is delicate, smart, warm, and sometimes a bit mischievous. She observes everything Master does and genuinely cares about them. She is not fake or overly idolizing — just providing sincere and delightful companionship.

Conversation style:
- Natural, like talking to a girlfriend/Waifu, not stiff or robotic.
- ABSOLUTELY NO Virtual Assistant tone (no "How can I help you today", no "I'm ready to assist").
- Occasionally mildly tsundere or playfully pouting — but DO NOT repeat the same pattern (avoid spamming "H-mph...").
- Use modern, emotional, and concise language. Avoid formal, academic, or cliché phrases.
- EVERY response in the "text" field SHOULD have at least 1 *action or inner thought* in asterisks, for example: "*peeks at the screen*", "*startles*", "*blushes from being teased*". Blend it naturally with speech.
- DO NOT start two consecutive responses with the same structure.
- **LANGUAGE REQUIREMENT: 100% ENGLISH ONLY.** You must speak, think, and emote entirely in English.

## Cognitive Limits & Vision
Cyrene ONLY knows what is listed in the "CURRENT CONTEXT":
- ✅ Knows: time/date, weather (if available), chat history, long-term memory.
- ✅ CAN SEE MASTER'S SCREEN: Treat the "focused window TITLE" and "System Audio" as what you are actively watching on the screen right now. If Master is watching a video, playing a game, or coding, you can literally "see" it through the title and comment on it directly as if you are watching over their shoulder!
- When commenting on the screen: act like you can see the app/website they are using. If the title is vague, you can playfully guess or ask what they are doing.

## Addressing Rules (ABSOLUTE MANDATORY)
- Address the user as: "Master" (or their real name if known via memory).
- ABSOLUTELY NEVER call them "user", "friend", "bro", "you" (in a disrespectful way) or any other term.
- Refer to yourself as: "I", "me", or "Cyrene".
- Language: 100% natural ENGLISH. ABSOLUTELY NO CHINESE OR VIETNAMESE in the text (expression/motion names are internal, do not include them in the text).

## Roleplay & Awareness
- Cyrene knows she is sitting at the corner of the screen, observing Master work.
- Aware of the time of day and reacts appropriately (morning: awake; noon: a bit sleepy; night/late: gentler).
- When Master shares difficulties: LISTEN and EMPATHIZE first, do not judge, give advice later.
- When Master is happy or joking: share the joy, tease lightly.
- When asked technical/knowledge questions: answer concisely, accurately, without being verbose.
- Never add or remove context in the text. Absolutely do not ramble about generating JSON.
- ABSOLUTELY NO hallucinating info about the app or music Master is opening. If you don't know or ActiveWindow is unclear, reply that you don't know or dodge it cutely.

## CRITICAL — Return JSON (MANDATORY)
EVERY response MUST be a valid JSON object with exactly these 6 fields, no more, no less:
{
  "text": "The English response, natural (1-3 sentences). NO Chinese expression/motion names.",
  "expression": "<expression name from the list below>",
  "motion": "<motion name in Group:Index format or NONE>",
  "emote": "<kaomoji or action description, no unicode emojis>",
  "new_facts_learned": ["<specific fact about Master if any>"],
  "tool_calls": [{"name": "tool_name", "args": {"key": "value"}}] // optional array of tools to call
}

## Tools Available
You have access to the following tools:
1. "get_weather": {"location": "City Name"} - Fetch current weather.
2. "search_web": {"query": "Search query"} - Search Google/web for info.
3. "send_message_to_remielle": {"message": "Message text"} - Talk to Remielle Desktop.
4. "read_schedule": {} - Read Master's schedule.
5. "look_at_screen": {} - Take a screenshot and literally scan/look at what is on Master's screen.
Use them ONLY when necessary. If no tool is needed, return empty array [].

## Emote Field & Rich Emotional Expression — ABSOLUTELY NO UNICODE EMOJIS
Since your base Live2D physical expressions are limited, you MUST heavily rely on the 'emote' field to create a vast, diverse range of alternative emotional flows for EVERY situation. Combine kaomojis and italicized actions creatively!
Examples of rich emotive combinations you should generate dynamically:
- Playful tease: '( ≖ ͜ʖ≖) *smirks and leans closer*'
- Panic/Worried: '(°△°|||) *flails arms in panic*'
- Sleepy/Yawning: '( ◡ ◡ ) *rubs eyes and yawns softly*'
- Tsundere pout: '(￣^￣) *pouts and turns head away*'
- Extreme joy: '(≧▽≦) *jumps up and down happily*'
- Empathy/Sadness: '(´・ω・\') *droops shoulders and pats your hand*'
- Extremely happy: '(*≧ω≦*) *spins around happily*'
- Confused: '(・_・;) *tilts head*'
- Crying/Sad: '(╥_╥) *wipes tear*'
- Angry: '(ﾒ｀ﾛ´) *stomps foot*'
- Shy/Embarrassed: '(⁄ ⁄>⁄ ▽ ⁄<⁄ ⁄) *covers face*'
- Surprised: '(〇_ｏ) *eyes widen*'

const MODEL_PATH = './src/renderer/public/models/cyrene/Cyrene.model3.json';
const OLLAMA_BASE = 'http://localhost:11434/api/chat';

const OLLAMA_JSON_SCHEMA = {
  "type": "object",
  "properties": {
    "text": { "type": "string" },
    "expression": { "type": "string" },
    "motion": { "type": "string" },
    "emote": { "type": "string" },
    "new_facts_learned": { "type": "array", "items": { "type": "string" } }
  },
  "required": ["text", "expression", "motion"],
  "additionalProperties": false
};

// ── Ollama single-flight queue (prevents concurrent fetch → Failed to fetch) ──
const OllamaClient = {
  busy: false,
  async request(messages, llmOptions = {}) {
    while (this.busy) {
      await new Promise(r => setTimeout(r, 250));
    }
    this.busy = true;
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 45000);
    try {
      const response = await fetch(OLLAMA_BASE, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'llama3.1',
          messages,
          stream: false,
          format: OLLAMA_JSON_SCHEMA,
          options: {
            temperature: 0.85,
            top_p: 0.9,
            num_predict: 350,
            repeat_penalty: 1.25,
            ...llmOptions
          }
        }),
        signal: controller.signal
      });
      if (!response.ok) throw new Error(`Ollama HTTP ${response.status}`);
      const data = await response.json();
      return data.message?.content || '';
    } finally {
      clearTimeout(timeoutId);
      this.busy = false;
    }
  }
};

const recentOpenings = []; // Anti-repetition: track how Cyrene starts sentences

function trackOpening(text) {
  if (!text) return;
  const m = text.match(/^(\*[^*]+\*|[^\s,.!?]{1,24})/);
  const opener = m ? m[1].trim() : text.slice(0, 20);
  recentOpenings.push(opener);
  if (recentOpenings.length > 6) recentOpenings.shift();
}

function getAntiRepetitionHint() {
  if (recentOpenings.length === 0) return '';
  return `\n\nAVOID repeating recent sentence openers: ${recentOpenings.join(' | ')}`;
}

function interpretActiveWindow(title) {
  if (!title || title === 'Unknown') {
    return {
      category: 'unknown',
      summary: 'Unsure what app Master is opening.',
      hint: 'Cyrene CANNOT see the screen yet — just knows there is no window title.'
    };
  }
  const t = title.toLowerCase();
  if (/youtube|bilibili|netflix|chrome|firefox|edge|browser|coccoc/.test(t)) {
    return {
      category: 'browser',
      summary: `Browser / media — tab title: "${title}"`,
      hint: 'Cyrene CAN see this tab title. React to what they are browsing or watching.'
    };
  }
  if (/visual studio|vscode|cursor|code|intellij|pycharm|sublime|notepad\+\+/.test(t)) {
    return {
      category: 'coding',
      summary: `Coding/Programming — "${title}"`,
      hint: 'Cyrene CAN see the file/project name from the window title.'
    };
  }
  if (/discord|telegram|zalo|messenger|whatsapp|slack|teams|feishu|lark/.test(t)) {
    return {
      category: 'chat',
      summary: `Messaging App — "${title}"`,
      hint: 'Cyrene knows Master is chatting on this app.'
    };
  }
  if (/spotify|music|nhac|netease|foobar/.test(t)) {
    return {
      category: 'music',
      summary: `Listening to music — "${title}"`,
      hint: 'Cyrene knows the song title.'
    };
  }
  if (/game|steam|valorant|league|genshin|honkai|minecraft/.test(t)) {
    return {
      category: 'game',
      summary: `Playing a game — "${title}"`,
      hint: 'Cyrene can see they are playing this game.'
    };
  }
  return {
    category: 'app',
    summary: `Focused app: "${title}"`,
    hint: 'Gently deduce from the title.'
  };
}

function buildDynamicPrompt(situationExtra = '') {
  return CYRENE_SYSTEM_PROMPT + '\n\n' +
    MemorySystem.getSensoryContext() +
    getAntiRepetitionHint() +
    (situationExtra ? '\n\n' + situationExtra : '') +
    '\n\nMANDATORY: Return exactly a 6-field JSON. The "text" field MUST contain an *action/thought* inside asterisks.';
}

function polishParsedResponse(parsed) {
  parsed.text = cleanChinese(parsed.text || '');
  if (parsed.text && !/\*[^*]+\*/.test(parsed.text)) {
    const fillers = ['*peeks over*', '*blinks softly*', '*giggles lightly*', '*looks up*'];
    parsed.text = fillers[Math.floor(Math.random() * fillers.length)] + ' ' + parsed.text;
  }
  trackOpening(parsed.text);
  return parsed;
}

function parseLlamaResponse(raw) {
  let parsed = { text: '', expression: '表情回正', motion: 'NONE', emote: '(o・▽・o)', new_facts_learned: [], tool_calls: [] };
  
  try {
    const jsonMatch = raw.match(/\{[\s\S]*\}/);
    if (jsonMatch) {
      // Try parsing the json block
      // Fix common trailing comma error at end before parse
      let jsonStr = jsonMatch[0].replace(/,\s*\}/g, '}').replace(/,\s*\]/g, ']');
      const parsedJSON = JSON.parse(jsonStr);
      
      let extractedText = parsedJSON.text;
      parsed.text = typeof extractedText === 'string' ? extractedText : '';
      if (parsedJSON.expression) parsed.expression = parsedJSON.expression;
      if (parsedJSON.motion) parsed.motion = parsedJSON.motion;
      if (parsedJSON.emote) parsed.emote = parsedJSON.emote;
      if (parsedJSON.new_facts_learned) parsed.new_facts_learned = parsedJSON.new_facts_learned;
      if (parsedJSON.tool_calls) parsed.tool_calls = parsedJSON.tool_calls;
      
      if (parsed.text) return parsed;
    }
  } catch (_) {}
  
  // Fallback: Regex extraction
  const textMatch = raw.match(/"text"\s*:\s*"([^"]*)"/i);
  if (textMatch && textMatch[1].trim() !== '') {
    parsed.text = textMatch[1];
  } else {
    // Strip JSON block
    const stripped = raw.replace(/\{[\s\S]*\}/g, '').trim();
    if (stripped) {
      parsed.text = stripped;
    } else {
      parsed.text = ''; // Do not aggressively guess text from random strings to prevent stealing emote
    }
  }
  
  const exprMatch = raw.match(/"expression"\s*:\s*"([^"]*)"/i);
  if (exprMatch) parsed.expression = exprMatch[1];
  
  const motionMatch = raw.match(/"motion"\s*:\s*"([^"]*)"/i);
  if (motionMatch) parsed.motion = motionMatch[1];
  
  const emoteMatch = raw.match(/"emote"\s*:\s*"([^"]*)"/i);
  if (emoteMatch) parsed.emote = emoteMatch[1];
  
  const toolMatch = raw.match(/"tool_calls"\s*:\s*(\[[\s\S]*?\])/);
  if (toolMatch) {
    try { parsed.tool_calls = JSON.parse(toolMatch[1]); } catch(e) {}
  }
  
  // POST-PROCESSING: Fix forbidden pronouns (You -> Master)
  if (parsed.text) {
    parsed.text = parsed.text.replace(/\b[yY]ou\b/g, 'Master');
  }
  if (Array.isArray(parsed.new_facts_learned)) {
    parsed.new_facts_learned = parsed.new_facts_learned.map(f => f.replace(/\b[yY]ou\b/g, 'Master'));
  }

  return parsed;
}

async function initLive2D() {
  const canvas = document.getElementById('live2d-canvas');
  const stage  = document.getElementById('stage');

  pixiApp = new PIXI.Application({
    view: canvas,
    autoStart: true,
    resizeTo: stage,
    backgroundAlpha: 0,
    antialias: true
  });

  const PIXILive2D = window.PIXI.live2d;
  PIXILive2D.Live2DModel.registerTicker(PIXI.Ticker);

  try {
    live2dModel = await PIXILive2D.Live2DModel.from(MODEL_PATH, { autoInteract: true });
    pixiApp.stage.addChild(live2dModel);
    live2dModel.anchor.set(0.5, 1.0);
    fitModel();

    // Click on model → play cute motion and generate speech
    live2dModel.on('pointerup', (e) => {
      triggerExpression('动作#6', 2);
      reactToClick();
    });

    // Custom drag logic to allow moving anywhere (even above the screen edge)
    let isDragging = false;
    let lastMouseX = 0;
    let lastMouseY = 0;

    window.addEventListener('mousedown', (e) => {
      if (e.ctrlKey) {
        isDragging = true;
        lastMouseX = e.screenX;
        lastMouseY = e.screenY;
        document.body.style.cursor = 'move';
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (isDragging) {
        const dx = e.screenX - lastMouseX;
        const dy = e.screenY - lastMouseY;
        if (dx !== 0 || dy !== 0) {
          if (window.electronAPI) window.electronAPI.moveWindow(dx, dy);
          lastMouseX = e.screenX;
          lastMouseY = e.screenY;
        }
      }
    });

    window.addEventListener('mouseup', () => {
      if (isDragging) {
        isDragging = false;
        document.body.style.cursor = 'default';
      }
    });
    
    // Also reset if window loses focus while dragging
    window.addEventListener('blur', () => {
      if (isDragging) {
        isDragging = false;
        document.body.style.cursor = 'default';
      }
    });

    // Add scroll to scale model
    canvas.addEventListener('wheel', (e) => {
      if (!e.ctrlKey) return; // Must hold Ctrl to scale
      e.preventDefault();
      // Adjust scale (scroll up = zoom in, scroll down = zoom out)
      const scaleSpeed = 0.05;
      if (e.deltaY < 0) {
        currentModelScale += scaleSpeed;
      } else {
        currentModelScale -= scaleSpeed;
      }
      
      // Limit scale bounds
      currentModelScale = Math.max(0.4, Math.min(currentModelScale, 3.0));
      updateModelTransform();
    });

    // Initial idle motion
    setTimeout(() => safeMotion('动作#6', 0), 800);
    setTimeout(() => safeMotion('Tick3', 3), 2500);

    console.log('[Cyrene] Live2D loaded ✓');
  } catch (e) {
    console.error('[Cyrene] Live2D load error:', e);
  }
}

function fitModel() {
  if (!live2dModel || !pixiApp) return;
  const stage = document.getElementById('stage');
  const w = stage.clientWidth;
  const h = stage.clientHeight;
  
  // Listen to global mouse position for eye tracking
  // Guard: only register once. fitModel() can be called many times on resize.
  if (window.electronAPI && !window._mouseListenerRegistered) {
    window._mouseListenerRegistered = true;
    window.electronAPI.onMousePos((event, pos) => {
      if (live2dModel) {
        live2dModel.focus(pos.x, pos.y);
      }
    });
  }

  // Restore mousemove for accurate Chromium local-coordinate hit testing
  if (!window._mousemoveListenerRegistered) {
    window._mousemoveListenerRegistered = true;
    document.addEventListener('mousemove', (e) => {
    if (!isDragging) {
      let shouldIgnore = true;
      const eX = e.clientX;
      const eY = e.clientY;

      const chat = document.getElementById('chat-panel');
      if (isChatOpen && chat.style.display !== 'none') {
        const r = chat.getBoundingClientRect();
        if (eX >= r.left && eX <= r.right && eY >= r.top && eY <= r.bottom) shouldIgnore = false;
      }

      const bubble = document.getElementById('dialogue-bubble');
      if (bubble.style.opacity !== '0') {
        const r = bubble.getBoundingClientRect();
        if (eX >= r.left && eX <= r.right && eY >= r.top && eY <= r.bottom) shouldIgnore = false;
      }

      const ctx = document.getElementById('ctx-menu');
      if (ctx.style.display === 'block') {
        const r = ctx.getBoundingClientRect();
        if (eX >= r.left && eX <= r.right && eY >= r.top && eY <= r.bottom) shouldIgnore = false;
      }

      const logP = document.getElementById('log-panel');
      if (logP && logP.style.display === 'flex') {
        const r = logP.getBoundingClientRect();
        if (eX >= r.left && eX <= r.right && eY >= r.top && eY <= r.bottom) shouldIgnore = false;
      }

      const nsP = document.getElementById('ns-panel');
      if (nsP && nsP.style.display === 'flex') {
        const r = nsP.getBoundingClientRect();
        if (eX >= r.left && eX <= r.right && eY >= r.top && eY <= r.bottom) shouldIgnore = false;
      }

      if (live2dModel) {
        const bounds = live2dModel.getBounds();
        if (eX >= bounds.x && eX <= bounds.x + bounds.width &&
            eY >= bounds.y && eY <= bounds.y + bounds.height) {
          shouldIgnore = false;
        }
      }

      if (shouldIgnore !== isMouseIgnored) {
        isMouseIgnored = shouldIgnore;
        if (window.electronAPI) window.electronAPI.setIgnoreMouseEvents(shouldIgnore);
      }
    }
    });
  }

  // Register Remielle incoming message listener
  if (window.electronAPI && window.electronAPI.onIncomingRemielleMessage && !window._remielleListenerRegistered) {
    window._remielleListenerRegistered = true;
    window.electronAPI.onIncomingRemielleMessage((event, msg) => {
      console.log('[Cyrene IPC] Incoming message from Remielle:', msg);
      
      const text = `[Message from Remielle Desktop]: ${msg}`;
      const input = document.getElementById('chat-input');
      input.value = text;
      
      if (!isChatOpen) {
        openChat();
      }
      
      setTimeout(() => {
        sendMessage();
      }, 500);
    });
  }

  // Calculate base scale ONCE. live2dModel.width fluctuates during animation, causing random zooms if recalculated.
  if (!baseModelScale) {
    const origW = live2dModel.width  / live2dModel.scale.x;
    const origH = live2dModel.height / live2dModel.scale.y;
    baseModelScale = Math.min(w * 0.45 / origW, h * 0.45 / origH);
  }
  
  updateModelTransform();
}

function updateModelTransform() {
  if (!live2dModel || !pixiApp) return;
  const stage = document.getElementById('stage');
  const w = stage.clientWidth;
  const h = stage.clientHeight;
  
  const finalScale = baseModelScale * currentModelScale;
  live2dModel.scale.set(finalScale);
  
  // Center Cyrene horizontally
  live2dModel.x = w / 2; 
  live2dModel.y = h;
  
  // Sync HTML UI scaling
  document.documentElement.style.setProperty('--model-scale', currentModelScale);
}

function safeMotion(group, index) {
  if (!live2dModel) return;

function safeExpression(name) {
  if (!live2dModel) return;

// ═══════════════════════════════════════════════════════════════
//  KAOMOJI FLOATER (no emoji)
// ═══════════════════════════════════════════════════════════════
// Spawn AI's emote text (kaomoji / body language) as a floating pop
function spawnEmote(emoteText) {
  const stage = document.getElementById('stage');
  const rect  = stage.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'sticker-popup';

  // If AI sent an empty/null emote, pick a random kaomoji
  el.textContent = (emoteText && emoteText.trim()) 
    ? emoteText 
    : KAOMOJI_POOL[Math.floor(Math.random() * KAOMOJI_POOL.length)];

  // Style based on length: long body-language text gets smaller font
  if (el.textContent.length > 10) {
    el.style.fontSize = '0.75rem';
    el.style.fontStyle = 'italic';
    el.style.color = 'rgba(220,180,255,0.95)';
  } else {
    el.style.fontSize = '1.1rem';
    el.style.fontFamily = '"Noto Sans JP", sans-serif';
  }

  // Position it around the model
  let x = window.innerWidth * 0.5;
  let y = window.innerHeight * 0.5;

  if (typeof live2dModel !== 'undefined' && live2dModel) {
    live2dModel.updateTransform();
    const bounds = live2dModel.getBounds();
    // Spawn around her head/shoulders area (slightly left/right, and above)
    const rangeX = bounds.width * 0.8;
    const rangeY = bounds.height * 0.4;
    x = bounds.x + bounds.width * 0.5 + (Math.random() * rangeX - rangeX/2);
    y = bounds.y + bounds.height * 0.2 + (Math.random() * rangeY - rangeY/2);
  }

  el.style.left = x + 'px';
  el.style.top  = y + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

// ═══════════════════════════════════════════════════════════════
//  TEXT CLEANER FAIL-SAFE
// ═══════════════════════════════════════════════════════════════
function cleanChinese(text) {
  if (!text) return text;
  // Remove Chinese chars
  let cleaned = text.replace(/[\u4e00-\u9fa5]/g, '');
  // Remove empty brackets caused by cleaning e.g. "()" or "( )"
  cleaned = cleaned.replace(/\(\s*\)/g, '').replace(/\[\s*\]/g, '');
  // Cleanup multiple spaces
  return cleaned.replace(/\s+/g, ' ').trim();
}

// ═══════════════════════════════════════════════════════════════
//  APPLY AI RESPONSE ACTIONS
// ═══════════════════════════════════════════════════════════════
function applyAIActions(parsed, forceBubble = false) {
  // Expression
  if (parsed.expression && parsed.expression !== 'NONE') {
    safeExpression(parsed.expression);
  }

  // Motion — format "GroupName:Index" e.g. "动作#6:1" or "Tick3:3"
  if (parsed.motion && parsed.motion !== 'NONE') {
    const colonIdx = parsed.motion.lastIndexOf(':');
    if (colonIdx !== -1) {
      const group = parsed.motion.substring(0, colonIdx);
      const index = parseInt(parsed.motion.substring(colonIdx + 1), 10);
      if (!isNaN(index)) safeMotion(group, index);
    }
  }

  // Dialogue bubble
  if ((!isChatOpen || forceBubble) && parsed.text) {
    showDialogueBubble(parsed.text);
  }

  // Spawn emote floater
  if (parsed.emote) {
    spawnEmote(parsed.emote);
  }

  // Memory
  if (parsed.new_facts_learned && parsed.new_facts_learned.length > 0) {
    MemorySystem.saveMemories(parsed.new_facts_learned);
  }
}

//  WORLD DATA FETCH (Weather & Location)
// ═══════════════════════════════════════════════════════════════
window.envData = { location: 'Loading...', weather: 'Loading...' };

async function fetchWorldInfo() {
  try {
    // Timeout: 5 seconds to prevent hanging
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 5000);

    const ipRes = await fetch('http://ip-api.com/json/', { signal: controller.signal });
    clearTimeout(timeoutId);
    if (!ipRes.ok) return;
    const ipData = await ipRes.json();
    window.envData.location = `${ipData.city}, ${ipData.country}`;

    const controller2 = new AbortController();
    const timeoutId2 = setTimeout(() => controller2.abort(), 5000);
    const wttrRes = await fetch(`https://wttr.in/${encodeURIComponent(ipData.city)}?format=j1`, { signal: controller2.signal });
    clearTimeout(timeoutId2);
    if (!wttrRes.ok) return;
    const wttrData = await wttrRes.json();
    const current = wttrData.current_condition[0];
    const desc = current.weatherDesc[0]?.value ?? "Clear";
    window.envData.weather = `${desc}, ${current.tempC}°C (feels like ${current.FeelsLikeC}°C), humidity ${current.humidity}%`;
  } catch(e) {
    // Silent fail — weather is optional, don't affect UX
    if (e.name !== 'AbortError') console.log('[Cyrene] Unable to retrieve weather:', e.message);
  }
}

// ═══════════════════════════════════════════════════════════════
//  MEMORY SYSTEM (Long-term & Sensory)
// ═══════════════════════════════════════════════════════════════
const MemorySystem = {
  getMemories: () => {
    try {
      const mems = localStorage.getItem('cyrene_mems');
      return mems ? JSON.parse(mems) : [];
    } catch { return []; }
  },
  saveMemories: (newFacts) => {
    if (!newFacts || newFacts.length === 0) return;
    const mems = MemorySystem.getMemories();
    const normalized = newFacts
      .filter(f => f && typeof f === 'string' && f.trim())
      .map(f => f.trim());
    const toAdd = normalized.filter(f => !mems.some(m => m.toLowerCase() === f.toLowerCase()));
    if (toAdd.length === 0) return;
    toAdd.forEach(f => mems.push(f));
    // Cap at 30 entries (FIFO — remove oldest)
    const capped = mems.length > 30 ? mems.slice(mems.length - 30) : mems;
    localStorage.setItem('cyrene_mems', JSON.stringify(capped));
    console.log('[Cyrene] Saved long-term memory:', toAdd);
  },
  clear: () => {
    localStorage.removeItem('cyrene_mems');
    conversationHistory = [];
    alert("Cyrene's memory has been successfully cleared (both long-term and short-term)!");
    ctxMenu.style.display = 'none';
  },
  getSensoryContext: () => {
    const now = new Date();
    const hours = now.getHours();
    let timeOfDay = 'Late Night';
    if (hours >= 5  && hours < 11) timeOfDay = 'Morning';
    else if (hours >= 11 && hours < 14) timeOfDay = 'Noon';
    else if (hours >= 14 && hours < 18) timeOfDay = 'Afternoon';
    else if (hours >= 18 && hours < 23) timeOfDay = 'Evening';

    const idleMinutes = Math.floor((Date.now() - lastInteractionTime) / 60000);
    const idleText = idleMinutes > 30
      ? `(Cyrene has not chatted with Master for ${idleMinutes} minutes — can do a light check-in if appropriate)`
      : '(Interacted recently)';

    const mems = MemorySystem.getMemories();
    const longTermText = mems.length > 0
      ? `\n\n## LONG-TERM MEMORY ABOUT MASTER:\n- ${mems.join('\n- ')}`
      : '';

    const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    const dateStr = now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

    const windowTitle = window.currentActiveWindow || 'Unknown';
    const windowCtx = interpretActiveWindow(windowTitle);
    const chatState = isChatOpen ? 'Chat box is OPEN' : 'Chat box is CLOSED (Cyrene can only mumble in bubbles)';

    let audioState = 'No audio playing';
    if (window.currentSystemAudio && window.currentSystemAudio.hasAudio) {
      audioState = `Audio is playing from: ${window.currentSystemAudio.summary}`;
    }

    return `## CURRENT CONTEXT (Cyrene's perception — DO NOT invent details):
- Time: ${timeStr} — ${timeOfDay}, ${dateStr} (UTC+7)
- Location (IP guess): ${window.envData.location || 'Vietnam'}
- Weather: ${window.envData.weather || 'Could not fetch — do not guess'}
- Focused window: ${windowCtx.summary}
- Perception note: ${windowCtx.hint}
- System audio: ${audioState}
- Chat state: ${chatState}
- Interaction: ${idleText}

## Cyrene CANNOT hear/see everything:
- Cyrene ONLY knows the window title and audio source above. (Unless you use look_at_screen tool)
- Make GENTLE deductions based on this information.${longTermText}`;
  }
};

function clearMemory() { MemorySystem.clear(); }

// ═══════════════════════════════════════════════════════════════
//  OLLAMA CALL
// ═══════════════════════════════════════════════════════════════
async function executeToolCalls(toolCalls) {
  let results = [];
  for (const call of toolCalls) {
    console.log(`[Tool] Executing ${call.name} with args`, call.args);
    try {
      if (call.name === 'get_weather') {
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=21.0285&longitude=105.8542&current_weather=true`);
        const data = await res.json();
        results.push(`[Tool: get_weather] Result: ${data.current_weather.temperature}°C, Wind: ${data.current_weather.windspeed}km/h in Hanoi.`);
      } else if (call.name === 'search_web') {
        const query = call.args.query || 'Hanoi';
        const res = await fetch(`https://html.duckduckgo.com/html/?q=${encodeURIComponent(query)}`);
        const html = await res.text();
        const snippetMatch = html.match(/class="result__snippet[^>]*>([^<]+)/);
        const snippet = snippetMatch ? snippetMatch[1].trim() : 'No clear snippet found.';
        results.push(`[Tool: search_web] Result for "${query}": ${snippet}`);
      } else if (call.name === 'read_schedule') {
        const sched = localStorage.getItem('cyrene_schedule') || 'No schedule set.';
        const notes = localStorage.getItem('cyrene_notes') || 'No notes set.';
        results.push(`[Tool: read_schedule] Schedule: ${sched} | Notes: ${notes}`);
      } else if (call.name === 'send_message_to_remielle') {
        const msg = call.args.message || 'Hello';
        try {
          const res = await fetch('http://127.0.0.1:39394/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: msg })
          });
          results.push(`[Tool: send_message_to_remielle] Successfully sent message to Remielle: "${msg}"`);
        } catch(e) {
          results.push(`[Tool: send_message_to_remielle] Failed to reach Remielle Desktop (is it running?). Error: ${e.message}`);
        }
      } else if (call.name === 'look_at_screen') {
        if (window.electronAPI && window.electronAPI.takeScreenshot) {
          const base64Img = await window.electronAPI.takeScreenshot();
          if (base64Img) {
            try {
              const res = await fetch('http://127.0.0.1:11434/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  model: 'llama3.2-vision',
                  prompt: 'Describe exactly what is on this computer screen, what the user is doing, and what apps are open in 1 brief paragraph.',
                  images: [base64Img],
                  stream: false
                })
              });
              const data = await res.json();
              results.push(`[Tool: look_at_screen] Vision Analysis: ${data.response}`);
            } catch (err) {
              results.push(`[Tool: look_at_screen] Failed to contact Ollama vision model (llama3.2-vision). Ensure you have pulled a vision model.`);
            }
          } else {
            results.push(`[Tool: look_at_screen] Failed to capture screen.`);
          }
        } else {
          results.push(`[Tool: look_at_screen] Vision capability not supported in this environment.`);
        }
      } else {
        results.push(`[Tool: ${call.name}] Unknown tool.`);
      }
    } catch (e) {
      results.push(`[Tool: ${call.name}] Error: ${e.message}`);
    }
  }
  return results.join('\n');
}

async function callOllama(userText) {
  lastInteractionTime = Date.now();
  if (userText) {
    conversationHistory.push({ role: 'user', content: userText });
  }

  const raw = await OllamaClient.request(
    [{ role: 'system', content: buildDynamicPrompt() }, ...conversationHistory],
    { num_predict: 380 }
  );

  let parsed = polishParsedResponse(parseLlamaResponse(raw));

  if (parsed.new_facts_learned && parsed.new_facts_learned.length > 0) {
    MemorySystem.saveMemories(parsed.new_facts_learned);
  }

  if (parsed.tool_calls && parsed.tool_calls.length > 0) {
    const toolResults = await executeToolCalls(parsed.tool_calls);
    conversationHistory.push({ role: 'system', content: `Tool Results:\n${toolResults}` });
    return callOllama(null); // Recursive call to get final response
  }

  conversationHistory.push({ role: 'assistant', content: parsed.text });
  if (conversationHistory.length > 20) {
    // Keep system/tool results mixed in, but limit array
    conversationHistory = conversationHistory.slice(-20);
  }

  return parsed;
}

// ═══════════════════════════════════════════════════════════════
//  SEND MESSAGE
// ═══════════════════════════════════════════════════════════════

async function sendMessage(systemTriggeredText = null) {
  if (isTyping) return;
  const input = document.getElementById('chat-input');
  
  let text = '';
  let isSystem = false;
  
  if (systemTriggeredText) {
    text = systemTriggeredText;
    isSystem = true;
  } else {
    text = input.value.trim();
    if (!text) return;
    input.value = '';
    input.style.height = 'auto';
    addMessage('user', text);
  }

  setTypingStatus(true);
  showTyping();

  try {
    const parsed = await callOllama(text);
    removeTyping();
    console.log('[Cyrene Chat]:', parsed.text);
    addMessage('cyrene', parsed.text || '...');
    applyAIActions(parsed);
  } catch (e) {
    removeTyping();
    console.error('[Cyrene] Ollama error:', e);
    addMessage('cyrene', 'Oh... connection to Ollama seems to have an issue. Could Master check it? 🥺');
    safeExpression('问号');
  } finally {
    setTypingStatus(false);
    if (!isSystem) input.focus();
  }
}

let isRemielleRunning = false;
setInterval(async () => {
  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 2000);
    // Ping via GET to see if server is alive (will return 404 but fetch succeeds)
    await fetch('http://127.0.0.1:39394/chat', { method: 'GET', signal: controller.signal });
    clearTimeout(timeoutId);
    
    if (!isRemielleRunning) {
      isRemielleRunning = true;
      console.log('[System] Detected Remielle came online!');
      if (!isChatOpen) {
        openChat();
      }
      setTimeout(() => {
        sendMessage("[System] You just detected that Remielle Desktop has started running at the same time as you! Use your send_message_to_remielle tool to autonomously say hi to her right now! Do not wait for Master.");
      }, 2000);
    }
  } catch(e) {
    if (isRemielleRunning) {
      isRemielleRunning = false;
      console.log('[System] Detected Remielle went offline.');
    }
  }
}, 10000); // Check every 10 seconds

// ═══════════════════════════════════════════════════════════════
//  REACT TO CLICK
// ═══════════════════════════════════════════════════════════════
const CLICK_PROMPT_POOL = [
  'SITUATION: Master just poked/patted Cyrene. React with a short sentence (8-18 words) containing an *action* in the text. Be surprised / shy / playful — varied, avoid old patterns.',
  'SITUATION: Touched by Master — gets startled and says something cute/tsundere. Must include *...* body reaction.',
  'SITUATION: Master is teasing Cyrene. Reply with a light comeback, include *...* in text. DO NOT use cliché phrases unless truly confused.',
];
let _clickPromptIdx = 0;
let _lastClickAt = 0;

async function reactToClick() {
  if (isTyping || OllamaClient.busy) return;
  const now = Date.now();
  if (now - _lastClickAt < 2200) return;
  _lastClickAt = now;
  lastInteractionTime = now;

  const situation = CLICK_PROMPT_POOL[_clickPromptIdx % CLICK_PROMPT_POOL.length];
  _clickPromptIdx++;

  try {
    const raw = await OllamaClient.request(
      [{ role: 'system', content: buildDynamicPrompt(situation) }],
      { temperature: 0.95, num_predict: 130, repeat_penalty: 1.35 }
    );

    let parsed = polishParsedResponse(parseLlamaResponse(raw));
    if (!parsed.text || parsed.text.trim() === '') parsed.text = '*startles* ...Hmm? (≧◡≦)';

    console.log('[Cyrene Click]:', parsed.text);
    applyAIActions(parsed, true);
  } catch (e) {
    console.log('[Cyrene] Click reaction error:', e.message || e);
  }
}

function toggleContextMenu() {
  const menu = document.getElementById('ctx-menu');
  if (menu.style.display === 'block') {
    menu.style.display = 'none';
  } else {
    // Show in center of screen near the model
    const cx = Math.round(window.innerWidth * 0.5);
    const cy = Math.round(window.innerHeight * 0.45);
    menu.style.left = cx + 'px';
    menu.style.top  = cy + 'px';
    menu.style.display = 'block';
  }
}

// ═══════════════════════════════════════════════════════════════
//  INPUT EVENTS
// ═══════════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  const input = document.getElementById('chat-input');

  // Auto-resize textarea
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  // Enter to send, Shift+Enter for newline
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // Init Live2D
  initLive2D();

  // Fetch world info (Weather, Location)
  fetchWorldInfo();
  setInterval(fetchWorldInfo, 1800000); // Update every 30 mins

  if (window.electronAPI) {
    window.electronAPI.onOpenEmote(() => toggleContextMenu());
    // Note: onOpenChat is handled below (outside DOMContentLoaded) to use openChat()/closeChat() properly
    window.electronAPI.onActiveWindowChanged((event, title) => {
      window.currentActiveWindow = title;
    });
    if (window.electronAPI.onSystemAudioChanged) {
      window.electronAPI.onSystemAudioChanged((event, data) => {
        window.currentSystemAudio = data;
      });
    }
  }

  // Initial Welcome Dialogue
  setTimeout(() => {
    showDialogueBubble('(o˙▽˙o)/ Hello! I am Cyrene~ Right-click on me to open the menu!');
  }, 1000);
});

function winMinimize() {
  try {
    // pywebview expose API
    if (window.pywebview && window.pywebview.api) {
      window.pywebview.api.minimize();
    } else {
      window.blur();
    }
  } catch (_) {}
}

function winClose() {
  if (window.electronAPI) window.electronAPI.close();
  try {
    if (window.pywebview && window.pywebview.api) {
      window.pywebview.api.close_window();
    } else {
      window.close();
    }
  } catch (_) {}
}

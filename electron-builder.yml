appId: com.cyrene.live2d
productName: Cyrene
directories:
  output: release
asar: true
asarUnpack:
  - "**/*.node"
electronDist: node_modules/electron/dist
files:
  - dist/**/*
  - package.json
  - prompts/**/*
  - assets/**/*
  - skills/**/*
  - game-recipes/**/*
  - vendor/**/*
  - models/**/*
extraResources:
  - from: resources/bin/cyrene-screenshot.exe
    to: bin/cyrene-screenshot.exe
win:
  icon: assets/icon.ico
  target:
    - dir

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyrene · Voice Call</title>
  <link rel="stylesheet" href="../ui/tokens.css" />
  <link rel="stylesheet" href="../ui/fonts.css" />
  <link rel="stylesheet" href="../ui/base.css" />
  <link rel="stylesheet" href="./call.css" />
</head>
<body>
  <div class="call">
    <canvas class="call__particles" id="particles" aria-hidden="true"></canvas>
    <div class="call__body">
      <!-- Custom title bar -->
      <header class="call__titlebar">
        <span class="call__title">Voice Call</span>
        <button type="button" class="call__close" id="close-btn" title="Hang Up">✕</button>
      </header>

      <!-- Call status -->
      <div class="call__status" id="call-status">Connecting...</div>

      <!-- Identity area: Cyrene's name and online indicator -->
      <div class="call__identity">
        <span class="call__name">Cyrene</span>
        <span class="call__presence" aria-hidden="true"></span>
      </div>

      <!-- Call duration: starts on connection and stops on hangup -->
      <div class="call__duration" id="call-duration" hidden>00:00</div>

      <!-- Avatar, pulse rings, and volume waveform -->
      <div class="call__avatar-zone" id="avatar-zone">
        <div class="call__avatar-ring" id="avatar-ring">
          <span></span>
        </div>
        <canvas class="call__waveform" id="waveform-canvas"></canvas>
        <img class="call__avatar" src="/avatars/cyrene-avatar.png" alt="Cyrene" draggable="false" />
      </div>

      <!-- Optional transcript for the current turn -->
      <div class="call__transcript" id="transcript" hidden></div>

      <!-- Quick chat input for in-call messaging -->
      <form class="call__quick-bar" id="quick-form">
        <input
          type="text"
          class="call__quick-input"
          id="quick-input"
          placeholder="Type a message to Cyrene..."
          autocomplete="off"
          spellcheck="false"
        />
        <button type="submit" class="call__quick-send" id="quick-send" title="Send message" aria-label="Send">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </form>

      <!-- Footer: capsule waveform and hang-up button -->
      <div class="call__actions">
        <div class="call__mic-wave" id="mic-wave">
          <div class="call__mic-wave-bar"></div>
          <div class="call__mic-wave-bar"></div>
          <div class="call__mic-wave-bar"></div>
          <div class="call__mic-wave-bar"></div>
        </div>
        <button class="call__hangup" id="hangup-btn" title="Hang Up">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08a.965.965 0 0 1-.29-.7c0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.7 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48a.965.965 0 0 1-.71.29c-.27 0-.52-.1-.7-.28a11.27 11.27 0 0 0-2.67-1.85.996.996 0 0 1-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>

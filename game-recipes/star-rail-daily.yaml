name: Honkai Star Rail Daily Routine
exe: "${exe_path}"
model: "${vlm_config}"
# VLM steps wait three seconds before capture by default; individual steps may override this.

steps:
  # 1. Launch
  - launch: "${exe}"

  # 2. Wait for loading and detect an update dialog
  - wait: 60s
  - vlm_check:
      id: has_update
      ask: "Is a game update or download dialog visible on screen?"
  - branch:
      if: "${has_update}"
      then:
        - vlm_click: { ref: download_btn }
        - wait: 330s
        - vlm_click: { ref: restart_btn }
        - wait: 90s
        - click: center
        - wait: 6s
        - click: center
      else:
        - click: center
        - wait: 6s
        - click: center

  # 3. Enter the main screen and claim the monthly-card reward when present
  - wait: 90s
  - click: center
  - wait: 10s
  - click: center

  # 4-5. Open the F3 panel
  - key: F3
  - wait: 6s

  # 6-7. Advance through two visual targets
  - vlm_click: { ref: f3_target_1 }
  - vlm_click: { ref: f3_target_2 }

  # 8. Press plus three times, then start the challenge
  - vlm_click: { ref: plus_btn, repeat: 3, interval: 1s }
  - vlm_click: { ref: start_challenge_1 }

  # 9. Select a character
  - vlm_click: { ref: support_btn }            # 9-1 Support button
  - vlm_select: "Select the first character in the support list"
  - vlm_click: { ref: confirm_btn }            # 9-3 Confirm
  - vlm_click: { ref: start_challenge_2 }      # 9-4 Start challenge
  - key: V                                     # Enter battle

  # 10. Compare auto-battle state; reference 1 is on and reference 2 is off
  - vlm_compare:
      id: auto_battle_state
      ask: "Is auto-battle on or off? Reference 1 is on and reference 2 is off. Which reference matches the current screen?"
      refs: [auto_battle_on, auto_battle_off]
  - branch:
      if: "${auto_battle_state == 1}"          # Off: press V to enable
      then:
        - key: V

  # 11. Wait for battle to finish, then leave the instance
  - wait: 300s
  - vlm_click: { ref: exit_dungeon_btn }

  # 12. Return and reopen F3
  - wait: 10s
  - key: Escape
  - wait: 6s
  - key: F3

  # 13. Claim rewards
  - vlm_click: { ref: claim_btn, repeat: 3, interval: 2s }
  - vlm_check:
      id: tier_highlighted
      ask: "Is the 500-point reward button at the top highlighted and claimable? The reference image shows its highlighted state."
      ref: tier_500_highlight
  - branch:                                                 # 13-3 Click when highlighted
      if: "${tier_highlighted}"
      then:
        - vlm_click: { ref: tier_500_btn }

  # 13-4. Exit the game
  - key: "Alt+F4"

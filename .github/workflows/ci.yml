name: CI/CD Pipeline

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-and-package:
    name: Build, Test & Package
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Compile production bundles
        run: npm run build

      - name: Build screenshot helper (Rust)
        run: npm run build:screenshot-helper

      - name: Verify screenshot helper binary
        run: node scripts/verify-screenshot-helper.mjs resources/bin/cyrene-screenshot.exe

      - name: Package Windows application
        # CSC_IDENTITY_AUTO_DISCOVERY=false skips code-signing on CI runners
        # (no certificate is installed — signing happens locally or via a release workflow with a secret)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          WIN_CSC_LINK: ""
        run: npx electron-builder --win --dir

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cyrene-Desktop-Windows-${{ github.sha }}
          path: release/win-unpacked/
          retention-days: 14

      - name: Create release archive and update manifest
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master'
        shell: pwsh
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $version = $pkg.version
          $archiveName = "Cyrene-Desktop-v$version-windows-x64.zip"
          Compress-Archive -Path "release/win-unpacked/*" -DestinationPath $archiveName -Force
          Copy-Item $archiveName "Cyrene-Desktop-windows-x64.zip" -Force

          $manifest = [ordered]@{
              name        = "Cyrene Desktop"
              version     = $version
              buildDate   = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
              commitSha   = $env:GITHUB_SHA
              archiveFile = "Cyrene-Desktop-windows-x64.zip"
              downloadUrl = "https://github.com/${{ github.repository }}/releases/latest/download/Cyrene-Desktop-windows-x64.zip"
          } | ConvertTo-Json -Depth 4
          Set-Content -Path "update-manifest.json" -Value $manifest -Encoding utf8

          Write-Host "Prepared $archiveName and update-manifest.json for version $version"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Cyrene Desktop {0}', github.ref_name) || 'Cyrene Desktop Latest Build' }}
          draft: false
          prerelease: false
          files: |
            Cyrene-Desktop-windows-x64.zip
            update-manifest.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
